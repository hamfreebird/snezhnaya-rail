[package]
name = "snezhnaya-rail"
version = "0.1.0"
edition = "2024"

[dependencies]
ab_glyph = "0.2.32"
axum = "0.8.9"
base64 = "0.23.1"
chrono = "0.4.45"
config = "0.15.25"
csv = "1.4.0"
image = "0.25.10"
imageproc = "0.27.0"
qrcode = "0.14.1"
rand = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tera = "1.19"
tokio = { version = "1.53.1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["fs", "trace", "compression-full"] }
tower_governor = "0.8.0"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "fmt"] }
uuid = { version = "1.24.0", features = ["v4"] }
