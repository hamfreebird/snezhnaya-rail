{% extends "base.html" %}

{% block content %}
<div class="payment-container">
  <h2><i class="fas fa-credit-card"></i> 支付确认</h2>
  <div class="payment-details">
    <p><strong>订单号：</strong>{{ order.id }}</p>
    <p><strong>车次：</strong>{{ base_train_id }}</p>
    <p><strong>乘客：</strong>{{ order.passenger_name }}</p>
    <p><strong>张数：</strong>{{ order.seat_count }}</p>
    <p><strong>总金额：</strong>{{ order.price }} 摩拉</p>
  </div>
  <td>   </td>
  <div class="payment-actions">
    <a href="/payment/{{ order.id }}/pay" class="btn-primary"><i class="fas fa-check"></i> 确认支付</a>
    <a href="/" class="btn-secondary"><i class="fas fa-times"></i> 取消</a>
  </div>
</div>
{% endblock %}
