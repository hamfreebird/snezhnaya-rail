{% extends "base.html" %}

{% block content %}
<div class="notifications-container">
  <h2><i class="fas fa-bullhorn"></i> 通知公告</h2>

  {% if notifications %}
  {% for notif in notifications %}
  <div class="notification-item">
    <h3>{{ notif.title }}</h3>
    <p>{{ notif.content }}</p>
  </div>
  {% endfor %}
  {% else %}
  <p>暂无通知。</p>
  {% endif %}

  {% if did_you_know %}
  <div class="did-you-know" role="note" aria-label="你知道吗">
    <div class="did-you-know-icon"><i class="fas fa-lightbulb"></i></div>
    <div class="did-you-know-body">
      <h3>你知道吗？</h3>
      <p>{{ did_you_know }}</p>
    </div>
  </div>
  {% endif %}
</div>
{% endblock %}
