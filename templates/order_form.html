{% extends "base.html" %}

{% block content %}
<div class="order-form-container">
  <h2><i class="fas fa-edit"></i> 填写乘客信息</h2>

  <div class="order-summary-card">
    <div class="summary-row">
      <span class="label"><i class="fas fa-train"></i> 车次</span>
      <span class="value">{{ train.base_train_id }}</span>
    </div>
    <div class="summary-row">
      <span class="label"><i class="fas fa-route"></i> 区间</span>
      <span class="value">{{ from }} → {{ to }}</span>
    </div>
    <div class="summary-row">
      <span class="label"><i class="fas fa-clock"></i> 出发</span>
      <span class="value">{{ departure }} &nbsp;|&nbsp; <span class="label">到达</span> {{ arrival }}</span>
    </div>
    <div class="summary-row highlight">
      <span class="label"><i class="fas fa-tag"></i> 票价</span>
      <span class="value">{{ total_price }} 摩拉</span>
    </div>
    <div class="summary-row">
      <span class="label"><i class="fas fa-chair"></i> 余票</span>
      <span class="value">{{ min_seats }}</span>
    </div>
  </div>

  <form action="/order/create" method="post" class="order-form" id="orderForm">
    <input type="hidden" name="train_id" value="{{ train.id }}">
    <input type="hidden" name="from" value="{{ from }}">
    <input type="hidden" name="to" value="{{ to }}">
    <input type="hidden" name="total_price" value="{{ total_price }}">
    <input type="hidden" name="date" value="{{ selected_date }}">
    <input type="hidden" name="from_platform" value="{{ from_platform }}">

    <div class="field-group">
      <label for="passenger_name"><i class="fas fa-user"></i> 乘客姓名</label>
      <input type="text" id="passenger_name" name="passenger_name" placeholder="请输入全名" required>
      <div class="notice-tip" style="margin-top:6px;">
        <i class="fas fa-info-circle"></i> 请勿填写可能泄露个人隐私信息的内容！
      </div>
    </div>

    <div class="field-group">
      <label for="seat_count"><i class="fas fa-ticket-alt"></i> 购票张数</label>
      <input type="number" id="seat_count" name="seat_count" min="1" max="{{ min_seats }}" value="1" required>
    </div>

    <div class="field-group" style="display:flex; gap:20px; flex-wrap:wrap;">
      <div style="flex:1;">
        <label for="carriage_index">车厢</label>
        <select name="carriage_index" id="carriage_index" required>
          <option value="">请选择</option>
          {% for c in carriages %}
          <option value="{{ c.index }}" data-label="{{ c.index }}车厢" data-corridor="{{ c.corridor }}" data-window="{{ c.window }}"
            {% if c.corridor == 0 and c.window == 0 %}disabled{% endif %}>
            {{ c.index }}车厢{% if c.corridor == 0 and c.window == 0 %}（无票）{% endif %}
          </option>
          {% endfor %}
        </select>
      </div>
      <div style="flex:1;">
        <label for="seat_category">坐席类别</label>
        <select name="seat_category" id="seat_category" required>
          <option value="corridor" data-label="靠走廊" {% if corridor_available == 0 %}disabled{% endif %}>
            靠走廊{% if corridor_available == 0 %}（无票）{% endif %}
          </option>
          <option value="window" data-label="靠窗" {% if window_available == 0 %}disabled{% endif %}>
            靠窗{% if window_available == 0 %}（无票）{% endif %}
          </option>
        </select>
      </div>
    </div>
    <div class="notice-tip" style="margin-top:6px;">
      <i class="fas fa-info-circle"></i> 灰色选项表示当前购票张数下无票或余票不足。
    </div>

    <div id="orderError" style="color:#ff6b6b; margin-top:10px; text-align:center;"></div>

    <div class="form-actions">
      <button type="submit" class="btn-primary"><i class="fas fa-lock"></i> 提交占座</button>
      <a href="/" class="btn-secondary"><i class="fas fa-times"></i> 取消</a>
    </div>
  </form>
</div>

<script>
  (function () {
    const form = document.getElementById('orderForm');
    const carriageSelect = document.getElementById('carriage_index');
    const categorySelect = document.getElementById('seat_category');
    const seatCountInput = document.getElementById('seat_count');
    if (!form || !carriageSelect || !categorySelect || !seatCountInput) return;

    const carriageOptions = Array.from(carriageSelect.options).filter(option => option.value !== '');
    const categoryOptions = Array.from(categorySelect.options);

    function requiredSeats() {
      const value = parseInt(seatCountInput.value, 10);
      return Number.isFinite(value) && value > 0 ? value : 1;
    }

    function availableCount(option, category) {
      return parseInt(option.dataset[category] || '0', 10) || 0;
    }

    function setOptionState(option, available, required) {
      const disabled = available < required;
      option.disabled = disabled;

      const baseLabel = option.dataset.label || option.textContent;
      let suffix = '';
      if (available <= 0) {
        suffix = '（无票）';
      } else if (disabled) {
        suffix = `（仅剩${available}张）`;
      }
      option.textContent = baseLabel + suffix;
      return disabled;
    }

    function updateAvailability() {
      const required = requiredSeats();
      const selectedCarriage = carriageSelect.selectedOptions[0];
      const hasCarriage = selectedCarriage && selectedCarriage.value !== '';

      // 坐席类别：已选车厢时按该车厢计算，否则取所有车厢中的最大值
      categoryOptions.forEach(option => {
        const available = hasCarriage
          ? availableCount(selectedCarriage, option.value)
          : Math.max(0, ...carriageOptions.map(carriage => availableCount(carriage, option.value)));
        setOptionState(option, available, required);
      });

      // 当前类别不可选时，自动切换到第一个可用类别
      if (categorySelect.selectedOptions[0] && categorySelect.selectedOptions[0].disabled) {
        const firstAvailable = categoryOptions.find(option => !option.disabled);
        if (firstAvailable) {
          categorySelect.value = firstAvailable.value;
        }
      }

      // 车厢：按当前坐席类别计算
      const category = categorySelect.value;
      carriageOptions.forEach(option => {
        setOptionState(option, availableCount(option, category), required);
      });

      // 当前车厢不可选时，回到“请选择”
      const currentCarriage = carriageSelect.selectedOptions[0];
      if (currentCarriage && currentCarriage.value !== '' && currentCarriage.disabled) {
        carriageSelect.value = '';
      }
    }

    seatCountInput.addEventListener('input', updateAvailability);
    seatCountInput.addEventListener('change', updateAvailability);
    carriageSelect.addEventListener('change', updateAvailability);
    categorySelect.addEventListener('change', updateAvailability);
    updateAvailability();
  })();
</script>

<script>
  document.getElementById('orderForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const form = this;
    const formData = new FormData(form);
    formData.append('_ajax', '1');

    const errorDiv = document.getElementById('orderError');
    errorDiv.textContent = '';

    fetch('/order/create', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams(formData)
    })
    .then(async res => {
      const contentType = res.headers.get('content-type') || '';
      if (!contentType.includes('application/json')) {
        const text = await res.text();
        console.error('非JSON响应:', text);
        throw new Error('服务器响应异常，请稍后重试');
      }
      const data = await res.json();
      console.log('后端返回数据:', data);  // 调试日志
      if (!res.ok) {
        throw new Error(data.message || '请求失败');
      }
      return data;
    })
    .then(data => {
      console.log('进入 then，data:', data);
      if (data.success && data.redirect) {
        console.log('准备跳转到:', data.redirect);
        // 使用 replace 避免历史记录干扰
        window.location.replace(data.redirect);
        // 保险起见，设置超时重试
        setTimeout(() => {
          window.location.href = data.redirect;
        }, 100);
      } else {
        errorDiv.textContent = data.message || '占座失败，请重试';
      }
    })
    .catch(err => {
      console.error('捕获错误:', err);
      errorDiv.textContent = err.message || '网络错误，请稍后重试';
    });
  });
</script>
{% endblock %}
