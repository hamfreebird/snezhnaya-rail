{% extends "base.html" %}

{% block content %}
<div class="order-form-container">
  <h2><i class="fas fa-edit"></i> 填写乘客信息</h2>

  <div class="order-summary-card">
    <div class="summary-row">
      <span class="label"><i class="fas fa-train"></i> 车次</span>
      <span class="value">{{ train.base_train_id }}</span>
    </div>
    <div class="summary-row">
      <span class="label"><i class="fas fa-route"></i> 区间</span>
      <span class="value">{{ from }} → {{ to }}</span>
    </div>
    <div class="summary-row">
      <span class="label"><i class="fas fa-clock"></i> 出发</span>
      <span class="value">{{ departure }} &nbsp;|&nbsp; <span class="label">到达</span> {{ arrival }}</span>
    </div>
    <div class="summary-row highlight">
      <span class="label"><i class="fas fa-tag"></i> 票价</span>
      <span class="value">{{ total_price }} 摩拉</span>
    </div>
    <div class="summary-row">
      <span class="label"><i class="fas fa-chair"></i> 余票</span>
      <span class="value">{{ min_seats }}</span>
    </div>
  </div>

  <form action="/order/create" method="post" class="order-form">
    <input type="hidden" name="train_id" value="{{ train.id }}">
    <input type="hidden" name="from" value="{{ from }}">
    <input type="hidden" name="to" value="{{ to }}">
    <input type="hidden" name="total_price" value="{{ total_price }}">
    <input type="hidden" name="date" value="{{ selected_date }}">
    <input type="hidden" name="from_platform" value="{{ from_platform }}">

    <div class="field-group">
      <label for="passenger_name"><i class="fas fa-user"></i> 乘客姓名</label>
      <input type="text" id="passenger_name" name="passenger_name" placeholder="请输入全名" required>
      <div class="notice-tip" style="margin-top:6px;">
        <i class="fas fa-info-circle"></i> 请勿填写可能泄露个人隐私信息的内容！
      </div>
    </div>

    <div class="field-group">
      <label for="seat_count"><i class="fas fa-ticket-alt"></i> 购票张数</label>
      <input type="number" id="seat_count" name="seat_count" min="1" max="{{ min_seats }}" value="1" required>
    </div>

    <div class="field-group" style="display:flex; gap:20px; flex-wrap:wrap;">
      <div style="flex:1;">
        <label for="carriage_index">车厢</label>
        <select name="carriage_index" id="carriage_index" required>
          <option value="">请选择</option>
          {% for i in range(start=1, end=train.carriage_count + 1) %}
          <option value="{{ i }}">{{ i }}车厢</option>
          {% endfor %}
        </select>
      </div>
      <div style="flex:1;">
        <label for="seat_category">坐席类别</label>
        <select name="seat_category" id="seat_category" required>
          <option value="corridor">靠走廊</option>
          <option value="window">靠窗</option>
        </select>
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn-primary"><i class="fas fa-lock"></i> 提交占座</button>
      <a href="/" class="btn-secondary"><i class="fas fa-times"></i> 取消</a>
    </div>
  </form>
</div>
{% endblock %}
