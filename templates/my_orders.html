{% extends "base.html" %}

{% block content %}
<div class="query-container">
  <h2><i class="fas fa-user"></i> 我的订单</h2>
  <form action="/my_orders/query" method="get" class="search-form">
    <div class="field-group">
      <label for="name">输入您的姓名</label>
      <input type="text" id="name" name="name" placeholder="与购票时填写一致" required value="{{ name }}">
    </div>
    <button type="submit" class="btn-primary"><i class="fas fa-search"></i> 查询</button>
  </form>
  {% if name %}
  <div class="order-list">
    <h3>订单列表（{{ name }}）</h3>
    {% if orders %}
    <table>
      <thead>
        <tr>
          <th>订单号</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody>
        {% for order_id in orders %}
        <tr>
          <td>{{ order_id }}</td>
          <td><a href="/orders?order_id={{ order_id }}" class="btn-secondary">查看详情</a></td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    {% else %}
    <p>未找到该用户的订单。</p>
    {% endif %}
  </div>
  {% endif %}
</div>
{% endblock %}
