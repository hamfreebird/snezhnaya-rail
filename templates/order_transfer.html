{% extends "base.html" %}

{% block content %}
<div class="transfer-confirm">
  <h2><i class="fas fa-exchange-alt"></i> 换乘订单确认</h2>
  <p>乘客：{{ passenger_name }}</p>
  <div class="order-links">
    <div class="order-item">
      <h3>第一段订单</h3>
      <p>订单号：{{ order1_id }}</p>
      <a href="/payment/{{ order1_id }}" class="btn-primary">立即支付</a>
    </div>
    <div class="order-item">
      <h3>第二段订单</h3>
      <p>订单号：{{ order2_id }}</p>
      <a href="/payment/{{ order2_id }}" class="btn-primary">立即支付</a>
    </div>
  </div>
  <p class="notice">请分别支付两段订单，每段支付有效期为30分钟。</p>
  <a href="/" class="btn-secondary">返回首页</a>
</div>
{% endblock %}
