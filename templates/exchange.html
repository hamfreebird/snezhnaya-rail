{% extends "base.html" %}

{% block content %}
<div class="exchange-container">
  <h2><i class="fas fa-exchange-alt"></i> 改签 / 退签</h2>
  <p>请输入您的订单号，查询后可进行改签或退签操作。</p>
  <form action="/exchange/query" method="get" class="search-form">
    <div class="field-group">
      <label for="order_id">订单号</label>
      <input type="text" id="order_id" name="order_id" placeholder="输入订单号" required>
    </div>
    <button type="submit" class="btn-primary"><i class="fas fa-search"></i> 查询</button>
  </form>
</div>
{% endblock %}
