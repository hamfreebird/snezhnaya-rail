{% extends "base.html" %}

{% block content %}
<div class="query-container">
  <h2><i class="fas fa-search"></i> 订单查询</h2>
  <p>请输入您的订单号，查询订单状态。</p>
  <form action="/orders" method="get" class="search-form" style="display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end;">
    <div class="field-group" style="flex: 3 1 300px;">
      <label for="order_id">订单号</label>
      <input type="text" id="order_id" name="order_id" placeholder="例如：12345678" required>
    </div>
    <div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center;">
      <button type="submit" class="btn-primary"><i class="fas fa-search"></i> 查询</button>
      <a href="/my_orders" class="btn-detail">我的订单</a>    
    </div>
  </form>
  <p class="hint"><i class="fas fa-info-circle"></i> 订单号可在占座成功页或支付页找到。</p>
</div>
{% endblock %}
