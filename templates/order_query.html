{% extends "base.html" %}

{% block content %}
<div class="query-container">
  <h2><i class="fas fa-search"></i> 订单查询</h2>
  <p>请输入您的订单号，查询订单状态。</p>
  <form action="/orders" method="get" class="search-form">
    <div class="field-group">
      <label for="order_id">订单号</label>
      <input type="text" id="order_id" name="order_id" placeholder="例如：5ffd17fa-a93c-4b5e-b74c-26a1d2a7e86a" required>
    </div>
    <button type="submit" class="btn-primary"><i class="fas fa-search"></i> 查询</button>
  </form>
  <p class="hint"><i class="fas fa-info-circle"></i> 订单号可在占座成功页或支付页找到。</p>
</div>
{% endblock %}
